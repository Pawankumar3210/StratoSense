[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratosense"
version = "0.1.0"
description = "StratoSense: deep-learning cloud segmentation for four-band Landsat 8 imagery."
requires-python = ">=3.10"
readme = "README.md"
# Runtime dependencies for the shared ML package (preprocessing, dataset, scene
# reconstruction). PyTorch is intentionally NOT listed here: install it with the
# wheel that matches your platform (see docs/deployment.md).
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
]

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the documented idiom.
extend-immutable-calls = ["fastapi.Depends"]
